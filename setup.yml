      PrivateSubnetCidrBlock2: 172.27.16.0/20
      PrivateSubnetCidrBlock3: 172.27.32.0/20
      PublicSubnetCidrBlock1: 172.27.48.0/20
      PublicSubnetCidrBlock2: 172.27.64.0/20
      PublicSubnetCidrBlock3: 172.27.80.0/20
      DbHost: db.prod.otimizador.arauco.app.br
      DbName: otimizador-prod
