  #S3GatewayEndPoint:
  #  Type: AWS::EC2::VPCEndpoint
  #  Properties:
  #    VpcId: !Ref MainVpc
  #    VpcEndpointType: Gateway
  #    RouteTableIds:
  #      - !Ref PrivateRouteTable
  #    ServiceName: !Sub com.amazonaws.${AWS::Region}.s3

  #DynamoGatewayEndPoint:
  #  Type: AWS::EC2::VPCEndpoint
  #  Properties:
  #    VpcId: !Ref MainVpc
  #    VpcEndpointType: Gateway
  #    RouteTableIds:
  #      - !Ref PrivateRouteTable
  #    ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
  
  #ApiGatewayPrivateEndpoint:
  #  Type: AWS::EC2::VPCEndpoint
  #  Properties:
  #    VpcId: !Ref MainVpc
  #    VpcEndpointType: Interface
  #    ServiceName: com.amazonaws.sa-east-1.execute-api
  #    PrivateDnsEnabled: true
  #    SubnetIds:
  #      - !Ref PrivateSubnet0
  #      - !Ref PrivateSubnet1
  #      - !Ref PrivateSubnet2
  #    SecurityGroupIds:
  #      - !Ref AppSecurityGroup

  # SECURITY GROUPS
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App Security Group
      GroupName: AppSG
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: !GetAtt MainVpc.CidrBlock
      VpcId: !Ref MainVpc    

  # DNS
  PublicDns:
    Type: AWS::Route53::HostedZone
    Properties:
      HostedZoneConfig:
        Comment: Public Hosted Zone
      Name: !Sub "${ENV}.otimizador.arauco.app.br"

  TecherSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Techer Security Group
      GroupName: TecherSG
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      VpcId: !Ref MainVpc

  # DEFAULT SECRET
  DefaultDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: DefaultDb
      Description: 'Default secret'
      SecretString: !Sub
        - '{"engine": "mysql", "host": "${Host}", "port": "3306", "dbname": "${Db}", "username": "${Username}", "password": "${Password}" }'
        - Db: !FindInMap [ !Ref ENV, values, DbName ]
          Host: !FindInMap [ !Ref ENV, values, DbHost ]
          Username: !FindInMap [ !Ref ENV, values, DbUsername ]
          Password: !FindInMap [ !Ref ENV, values, DbPassword ]

Outputs:
  VPC:
    Description: ID of the VPC
    Value: !Ref MainVpc
    Export:
      Name: !Sub "${AWS::StackName}-MainVPC"
  PublicSubnet0:
    Description: ID Public Subnet 0
    Value: !Ref PublicSubnet0
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet0"
  PublicSubnet1:
    Description: ID Public Subnet 1
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1"
  PublicSubnet2:
    Description: ID Public Subnet 2
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2"
  PrivateSubnet0:
    Description: ID Private Subnet 0
    Value: !Ref PrivateSubnet0
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet0"
  PrivateSubnet1:
    Description: ID Private Subnet 1
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1"
  PrivateSubnet2:
    Description: ID Private Subnet 2
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2"
  AppSecurityGroup:
    Description: App Security Group
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AppSecurityGroup"
