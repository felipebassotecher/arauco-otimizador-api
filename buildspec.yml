version: 0.2

phases:
  install:
    runtime-versions:
        dotnet: 9.0
    commands:
      - pip install aws-sam-cli --no-build-isolation
      - dotnet tool install -g Amazon.Lambda.Tools
  pre_build:
    commands:
      - credentials=$(aws sts assume-role --role-arn $DEPLOY_ROLE --role-session-name $(openssl rand -hex 12) | python -c "import json,sys;obj=json.load(sys.stdin);credentials = obj['Credentials'];print(credentials['AccessKeyId'] + '|' + credentials['SecretAccessKey'] + '|' + credentials['SessionToken'])")
      - key=$(echo $credentials | awk -F'[|]' '{print $1}')
      - secret=$(echo $credentials | awk -F'[|]' '{print $2}')
      - token=$(echo $credentials | awk -F'[|]' '{print $3}')
      - export AWS_ACCESS_KEY_ID=$key
      - export AWS_SECRET_ACCESS_KEY=$secret
      - export AWS_SESSION_TOKEN=$token
      - export AWS_DEFAULT_REGION=$AWS_REGION
      - echo $ENVIRONMENT
      - echo $APIDOMAIN
      - chmod +x deploy_api.sh
  build:
    commands:
      - ./deploy_api.sh
      # - cd Arauco.Otimizador.Deployment.Database
      # - dotnet build --configuration Release
      # - dotnet run --configuration Release -- $ENVIRONMENT
